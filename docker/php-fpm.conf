[global]
error_log = /var/log/php/error.log

[www]
user = nginx
group = nginx
listen = /var/run/php-fpm/php-fpm.sock
listen.owner = nginx
listen.group = nginx

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
access.log = /dev/null

; PHP error messages only. FastCGI logging stays off so nginx never records the request, and its ?k= key, with them
catch_workers_output = yes
decorate_workers_output = no

security.limit_extensions = .php

clear_env = no
